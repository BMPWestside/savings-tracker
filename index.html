<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a1330">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Savings">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Savings Tracker</title>
<style>
:root{
  box-sizing:border-box;
  --cobalt:#0D2A5E;--cyan:#1FA6E0;--gold:#D4B26D;--gold2:#e6cf9c;
  --ink:#eef2ff;--muted:#b3c1ea;--field:#112553;--line:#D4B26D;
  --pos:#5fd08a;--neg:#ff8a80;
}
*{box-sizing:border-box}
html{min-height:100%;background:#0a1330;color-scheme:dark}
.logo{display:block;margin:0 auto;object-fit:contain;background:none;height:auto}
.logo.big{width:min(270px,74vw)}
.logo.sm{width:130px}
html,body{overscroll-behavior-y:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0a1330 0,#0a1330 calc(100% - 14px),rgba(10,19,48,0) 100%);padding:calc(env(safe-area-inset-top,0px) + 56px) 0 14px;margin:0 -16px;padding-left:16px;padding-right:16px}
.top header{margin-top:0}
.top .tabs{margin-bottom:0}
body{margin:0 auto;max-width:560px;min-height:100vh;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{margin:2px 0 8px;padding:5px 7px;display:grid;grid-template-columns:34px 1fr 34px;align-items:center;text-align:center;border-radius:999px;border:2px solid var(--gold);background:linear-gradient(135deg,var(--cobalt),#2a509a);box-shadow:0 6px 16px rgba(0,0,0,.45)}
h1{margin:0;font-size:18px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#fff}
.rule{display:none}
.pb{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;letter-spacing:.5px;color:var(--gold);background:rgba(13,42,94,.55);opacity:.32;transition:opacity .25s,box-shadow .25s,background .25s}
.pb.on{opacity:1;color:#fff;background:linear-gradient(135deg,#e2c586,#b9923f);color:#0D2A5E;box-shadow:0 0 10px rgba(212,178,109,.65)}
.tabs{display:flex;border-radius:999px;border:2px solid var(--gold);padding:3px;margin-bottom:12px;background:rgba(13,42,94,.6)}
.tabs button{flex:1;border:2px solid transparent;background:none;padding:8px;border-radius:999px;font-size:16px;font-weight:800;color:var(--muted)}
.tabs button.on{background:linear-gradient(135deg,#4aa8e0,var(--cyan));border-color:var(--gold);color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.4)}
#cards{border:2px solid var(--gold);border-radius:24px;padding:8px;background:linear-gradient(180deg,#14306b,#0e2352)}
#cards .card:last-child{margin-bottom:0}
.card{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 16px;border-radius:18px;margin-bottom:6px;font-weight:800;font-size:18px;border:2px solid var(--gold)}
.card .amt{font-variant-numeric:tabular-nums}
.card.gold{background:rgba(196,146,30,.42);color:#ffe08a}
.card.savings{background:rgba(40,150,70,.42);color:#a6f2b0}
.card.emergency{background:rgba(205,45,45,.42);color:#ffb3b3}
.card.travel{background:rgba(45,115,225,.42);color:#b3d6ff}
.card.gold,.e.gold{border-color:#e8b84a}
.card.savings,.e.savings{border-color:#4fd16b}
.card.emergency,.e.emergency{border-color:#ff6b6b}
.card.travel,.e.travel{border-color:#5aa9ff}
.card,.e.gold,.e.savings,.e.emergency,.e.travel{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card.sel{box-shadow:0 0 0 4px var(--gold)}
h3{margin:8px 6px 5px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.e{display:flex;justify-content:space-between;align-items:center;background:var(--field);border:2px solid var(--gold);border-radius:14px;padding:7px 12px;margin-bottom:6px;font-size:13px}
.e small{display:block;color:var(--muted);margin-top:1px;font-size:12px}
#hist{position:relative;border:2px solid var(--gold);border-radius:24px;padding:8px;background:linear-gradient(180deg,#14306b,#0e2352);max-height:292px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#hist:empty{display:none}
#hist .e:last-child{margin-bottom:0}
.e.gold{background:rgba(196,146,30,.42);color:#ffe08a}
.e.savings{background:rgba(40,150,70,.42);color:#a6f2b0}
.e.emergency{background:rgba(205,45,45,.42);color:#ffb3b3}
.e.travel{background:rgba(45,115,225,.42);color:#b3d6ff}
.e.gold small,.e.savings small,.e.emergency small,.e.travel small{color:inherit;opacity:.75}
.e.gold .inc,.e.savings .inc,.e.emergency .inc,.e.travel .inc{color:#8dffa6}
.e.gold .exp,.e.savings .exp,.e.emergency .exp,.e.travel .exp{color:#ff9d9d}
.e.gold .del,.e.savings .del,.e.emergency .del,.e.travel .del{color:inherit;opacity:.7}
.inc{color:var(--pos);font-weight:800}.exp{color:var(--neg);font-weight:800}
.del{border:0;background:none;color:var(--muted);font-size:22px;margin-left:8px;padding:0 4px}
.panel{background:linear-gradient(180deg,#14306b,#0e2352);border:2px solid var(--gold);border-radius:26px;padding:14px}
.ph{display:flex;justify-content:space-between;align-items:baseline}.ph b{font-size:20px;color:#fff}.ph span{font-size:12px;color:var(--muted);font-weight:700}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:8px 6px 4px}
input,select{width:100%;height:42px;min-width:0;display:block;-webkit-appearance:none;appearance:none;padding:0 16px;font-size:16px;border:2px solid var(--gold);border-radius:999px;background:var(--field);color:var(--ink);font-family:inherit}
input::placeholder{color:#8da0d6}
input[type=date]{text-align:left;line-height:42px}
input:focus,select:focus{outline:3px solid var(--cyan)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.seg{display:flex;gap:10px}
.seg button{flex:1;padding:10px;font-size:16px;font-weight:800;border:2px solid var(--gold);background:var(--field);border-radius:999px;color:var(--muted)}
.seg button.on,.seg button.on.x{background:linear-gradient(135deg,#4aa8e0,var(--cyan));color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.save{width:100%;margin-top:12px;padding:12px;font-size:18px;font-weight:900;color:var(--cobalt);border:0;border-radius:999px;background:linear-gradient(135deg,#e2c586,var(--gold))}
.save:disabled{opacity:.6}
.msg{text-align:center;margin-top:6px;font-size:14px;font-weight:700;min-height:18px}.err{color:var(--neg)}.ok{color:var(--pos)}
.empty{text-align:center;color:var(--muted);padding:14px;font-size:14px}
.hide{display:none}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.sheet.hide{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(3,8,24,.65)}
.sheet-box{position:relative;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:28px;padding-bottom:18px;background:linear-gradient(180deg,#14306b,#0e2352)}
.btn2{width:100%;margin-top:10px;padding:13px;font-size:16px;font-weight:800;border-radius:999px;border:2px solid var(--gold);background:var(--field);color:var(--ink)}
.btn2.danger{color:var(--neg);border-color:var(--neg)}
.foot{text-align:center;color:var(--muted);opacity:.7;font-size:12px;margin:18px 0 4px}
#auth{display:none;text-align:center}
#auth p{color:var(--muted);margin:10px 0 0;font-size:14px}
.locked #auth{display:block}
.locked .tabs,.locked #funds,.locked #form,.locked .foot{display:none}
#mode.tap{cursor:pointer;color:var(--gold);text-decoration:underline}
</style>
</head>
<body class="locked">
<div class="top">
<header><span class="pb" id="pSM">SM</span><h1>Savings Tracker</h1><span class="pb" id="pDM">DM</span><div class="rule"></div></header>
<div class="tabs">
  <button id="t1" class="on" onclick="tab(1)">Funds</button>
  <button id="t2" onclick="tab(2)">New Entry</button>
</div>
</div>
<div id="auth" class="panel">
  <img class="logo big" src="logo.png" alt="Savings Tracker" style="margin-bottom:14px">
  <b style="font-size:20px;color:#fff">Sign in</b>
  <p>Use your Google account to open the tracker.</p>
  <button class="save" id="signin" onclick="doSignIn()">Sign in with Google</button>
  <div class="msg" id="amsg"></div>
</div>

<div id="funds">
  <div id="cards"></div>
  <h3 id="ht">Recent entries</h3>
  <div id="hist"></div>
</div>

<div id="form" class="hide">
  <div class="panel">
    <div class="ph"><b>New entry</b><span id="mode"></span></div>
    <div class="row">
      <div><label>Section</label><select id="section"><option value="">Choose section</option></select></div>
      <div><label>Amount (AUD)</label><input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
    </div>
    <label>Type</label>
    <div class="seg"><button id="bi" class="on" onclick="setType('Income')">Income</button><button id="bx" onclick="setType('Expense')">Expense</button></div>
    <label>Date</label><input id="date" type="date">
    <label>Description</label><input id="desc" placeholder="Optional" maxlength="120">
    <button class="save" id="save" onclick="save()">Save entry</button>
    <div class="msg" id="msg"></div>
  </div>
  <img class="logo sm" src="logo.png" alt="Savings Tracker" style="margin-top:12px">
</div>

<div id="sheet" class="sheet hide">
  <div class="sheet-bg" onclick="closeEdit()"></div>
  <div class="panel sheet-box">
    <div class="ph"><b>Edit entry</b><span></span></div>
    <div class="row">
      <div><label>Section</label><select id="e_section"></select></div>
      <div><label>Amount (AUD)</label><input id="e_amount" type="number" inputmode="decimal" step="0.01" min="0"></div>
    </div>
    <label>Type</label>
    <div class="seg"><button id="ei" class="on" onclick="setEType('Income')">Income</button><button id="ex" onclick="setEType('Expense')">Expense</button></div>
    <label>Date</label><input id="e_date" type="date">
    <label>Description</label><input id="e_desc" placeholder="Optional" maxlength="120">
    <button class="save" id="e_save" onclick="saveEdit()">Save changes</button>
    <button class="btn2 danger" onclick="delEdit()">Delete entry</button>
    <button class="btn2" onclick="closeEdit()">Cancel</button>
    <div class="msg" id="e_msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const SECTIONS=['Gold','Savings','Emergency','Travel'];let entries=[],type='Income',filter=null,store=null,role='';
const $=id=>document.getElementById(id);
const money=n=>'AUD '+n.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const fdate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})};
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tab(n){
  $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);
  $('funds').classList.toggle('hide',n!==1);$('form').classList.toggle('hide',n!==2);
  fitLayout();
}
function setType(t){type=t;$('bi').className=t==='Income'?'on':'';$('bx').className=t==='Expense'?'on x':''}
function balances(){const b={};SECTIONS.forEach(s=>b[s]=0);entries.forEach(e=>{if(e.section in b)b[e.section]+=e.type==='Income'?e.amount:-e.amount});return b}

function render(){
  const b=balances();
  $('cards').innerHTML=SECTIONS.map(s=>`<button class="card ${s.toLowerCase()} ${filter===s?'sel':''}" onclick="toggle('${s}')"><span>${s}</span><span class="amt">${money(b[s])}</span></button>`).join('');
  const list=entries.filter(e=>!filter||e.section===filter).sort((a,c)=>c.date.localeCompare(a.date)||(c.ts||0)-(a.ts||0));
  if(!filter){$('ht').style.display='none';$('hist').innerHTML='';return}
  $('ht').style.display='';$('ht').textContent=filter+' history'+(role==='owner'?' · tap an entry to edit':'');
  $('hist').innerHTML=list.length?list.map(e=>`<div class="e ${e.section.toLowerCase()}"${role==='owner'?` onclick="openEdit('${e.id}')" style="cursor:pointer"`:''}><div>${e.section}${e.desc?' · '+esc(e.desc):''}<small>${fdate(e.date)}</small></div><div><span class="${e.type==='Income'?'inc':'exp'}">${e.type==='Income'?'+':'−'}${e.amount.toFixed(2)}</span></div></div>`).join(''):'<div class="empty">No entries for this fund yet.</div>';
  fitLayout();
}
function toggle(s){filter=filter===s?null:s;render();$('hist').scrollTop=0}
function msg(t,c){$('msg').textContent=t;$('msg').className='msg '+(c||'')}

function save(){
  const amount=Math.round(parseFloat($('amount').value)*100)/100,section=$('section').value,date=$('date').value;
  if(!section)return msg('Choose a section','err');
  if(!(amount>0))return msg('Enter an amount above 0','err');
  if(!date)return msg('Pick a date','err');
  const bal=balances()[section];
  if(type==='Expense'&&amount>bal&&!confirm(section+' only has '+money(bal)+'. Save anyway?'))return;
  $('save').disabled=true;msg('Saving…');
  Promise.resolve(store.add({section,type,amount,date,person:'',desc:$('desc').value.trim()})).then(()=>{
    $('amount').value='';$('desc').value='';$('section').value='';$('save').disabled=false;msg('Saved ✓','ok');
    setTimeout(()=>{msg('');tab(1)},500);
  }).catch(e=>{$('save').disabled=false;msg('Could not save: '+(e&&e.message||'try again'),'err')});
}

let editId=null,etype='Income';
function setEType(t){etype=t;$('ei').className=t==='Income'?'on':'';$('ex').className=t==='Expense'?'on x':''}
function openEdit(id){
  if(role!=='owner')return;const e=entries.find(x=>x.id===id);if(!e)return;
  editId=id;$('e_section').value=e.section;$('e_amount').value=e.amount;setEType(e.type);
  $('e_date').value=e.date;$('e_desc').value=e.desc;$('e_msg').textContent='';$('e_msg').className='msg';
  $('sheet').classList.remove('hide');
}
function closeEdit(){$('sheet').classList.add('hide');editId=null}
function emsg(t,c){$('e_msg').textContent=t;$('e_msg').className='msg '+(c||'')}
function saveEdit(){
  const amount=Math.round(parseFloat($('e_amount').value)*100)/100,section=$('e_section').value,date=$('e_date').value;
  if(!section)return emsg('Choose a section','err');
  if(!(amount>0))return emsg('Enter an amount above 0','err');
  if(!date)return emsg('Pick a date','err');
  $('e_save').disabled=true;emsg('Saving…');
  Promise.resolve(store.edit(editId,{section,type:etype,amount,date,desc:$('e_desc').value.trim()}))
    .then(()=>{$('e_save').disabled=false;closeEdit()})
    .catch(e=>{$('e_save').disabled=false;emsg('Could not save: '+(e&&e.message||'try again'),'err')});
}
function delEdit(){
  if(!confirm('Delete this entry?'))return;
  Promise.resolve(store.del(editId)).then(closeEdit).catch(e=>emsg('Could not delete: '+(e&&e.message||'try again'),'err'));
}

/* Storage: Google Sheets API (OAuth via Google Identity Services) */
const C=window.APP_CONFIG,L=localStorage,enc=encodeURIComponent;
const API='https://sheets.googleapis.com/v4/spreadsheets/'+C.SHEET_ID;
const SCOPE='https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email';
let token=null,email=L.getItem('st_email')||'',tc=null;
try{const t=JSON.parse(L.getItem('st_token')||'null');if(t&&t.exp>Date.now()+60000)token=t.v}catch(e){}
try{entries=JSON.parse(L.getItem('st_cache')||'[]')}catch(e){}
role=L.getItem('st_role')||'';

function gisReady(){tc=google.accounts.oauth2.initTokenClient({client_id:C.CLIENT_ID,scope:SCOPE,callback:()=>{}});boot()}
function signIn(){return new Promise((res,rej)=>{
  if(!tc)return rej(new Error('Google sign-in not loaded'));
  tc.callback=r=>{if(r.error)return rej(new Error(r.error));token=r.access_token;
    L.setItem('st_token',JSON.stringify({v:token,exp:Date.now()+(r.expires_in-60)*1000}));res(token)};
  tc.error_callback=e=>rej(new Error(e.type==='popup_closed'?'Sign-in cancelled':'Sign-in blocked'));
  const o={prompt:email?'':'select_account'};if(email)o.login_hint=email;tc.requestAccessToken(o);
})}
const tok=()=>token?Promise.resolve(token):signIn();

async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});
  if(r.status===401){token=null;L.removeItem('st_token');throw new Error('Session expired. Tap to reconnect.')}
  if(!r.ok){let m='Request failed';try{m=(await r.json()).error.message}catch(e){}throw new Error(m)}
  return r.json();
}
/* Sheet layout: tab "Entries", data table headers in row 15, entries from row 16.
   Columns: A Date | B Person | C Section | D Type | E Amount | F Description */
const FIRST=16;
function toISO(v){
  if(typeof v==='number'){return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10)}
  const s=String(v||'').trim();let m;
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return s;
}
async function readRows(){
  const d=await api('/values/'+enc('Entries!A'+FIRST+':F')+'?valueRenderOption=UNFORMATTED_VALUE');
  return d.values||[];
}
async function fetchEntries(){
  const rows=await readRows();
  entries=[];
  rows.forEach((r,i)=>{
    const section=String(r[2]||'').trim(),type=String(r[3]||'').trim(),amount=Number(r[4]);
    if(!section||!type||!(amount>=0))return;
    entries.push({id:String(FIRST+i),row:FIRST+i,date:toISO(r[0]),person:String(r[1]||''),section,type,amount,desc:String(r[5]||''),ts:FIRST+i});
  });
  L.setItem('st_cache',JSON.stringify(entries));render();
}
store={
  add:async e=>{await tok();
    const n=FIRST+(await readRows()).length;
    await api('/values/'+enc('Entries!A'+n+':F'+n)+'?valueInputOption=USER_ENTERED',{method:'PUT',body:JSON.stringify({values:[[e.date,e.person,e.section,e.type,e.amount,e.desc]]})});
    await fetchEntries()},
  edit:async(id,e)=>{await tok();
    const old=entries.find(x=>x.id===id);if(!old)return;
    const rows=await readRows(),r=rows[old.row-FIRST]||[];
    if(String(r[2]||'').trim()!==old.section||Number(r[4])!==old.amount){await fetchEntries();throw new Error('Sheet changed, reloaded')}
    const n=old.row;
    await api('/values/'+enc('Entries!A'+n+':F'+n)+'?valueInputOption=USER_ENTERED',{method:'PUT',body:JSON.stringify({values:[[e.date,old.person,e.section,e.type,e.amount,e.desc]]})});
    await fetchEntries()},
  del:async id=>{await tok();
    const old=entries.find(x=>x.id===id);if(!old)return;
    const rows=await readRows(),r=rows[old.row-FIRST]||[];
    if(String(r[2]||'').trim()!==old.section||Number(r[4])!==old.amount){await fetchEntries();throw new Error('Sheet changed, reloaded')}
    const m=await api('?fields=sheets.properties');const sid=m.sheets.find(s=>s.properties.title==='Entries').properties.sheetId;
    await api(':batchUpdate',{method:'POST',body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId:sid,dimension:'ROWS',startIndex:old.row-1,endIndex:old.row}}}]})});
    await fetchEntries()}
};

function setBadges(){$('pSM').classList.toggle('on',role==='owner');$('pDM').classList.toggle('on',role==='viewer')}
function applyRole(){
  setBadges();
  $('mode').className='';$('mode').onclick=null;
  $('mode').textContent=role==='owner'?'':'View only';
  $('t2').classList.toggle('hide',role!=='owner');
  if(role!=='owner')tab(1);
}
function reconnectBanner(){$('mode').textContent='Tap to reconnect';$('mode').className='tap';$('mode').onclick=async()=>{try{await signIn();await start()}catch(e){}}}

async function start(){
  if(!email||!role){
    const u=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}})).json();
    email=(u.email||'').toLowerCase();
    role=email===C.OWNER.toLowerCase()?'owner':C.VIEWERS.map(x=>x.toLowerCase()).includes(email)?'viewer':'none';
    L.setItem('st_email',email);L.setItem('st_role',role);
  }
  if(role==='none'){const m='No access for '+email;signOut();$('amsg').textContent=m;$('amsg').className='msg err';return}
  document.body.classList.remove('locked');applyRole();
  try{await fetchEntries()}catch(e){reconnectBanner()}
}
async function doSignIn(){
  $('amsg').textContent='';$('amsg').className='msg';
  try{await signIn();await start()}catch(e){$('amsg').textContent=e.message;$('amsg').className='msg err'}
}
function signOut(){
  try{if(token)google.accounts.oauth2.revoke(token)}catch(e){}
  ['st_token','st_email','st_role','st_cache'].forEach(k=>L.removeItem(k));
  token=null;email='';role='';entries=[];setBadges();document.body.classList.add('locked');render();
}
function boot(){
  if(token)start();
  else if(email&&role){document.body.classList.remove('locked');applyRole();render();reconnectBanner()}
}
function reserve(){return(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches))?24:90}
function fitHist(){
  const h=$('hist');h.style.maxHeight='';
  const r=h.querySelectorAll('.e');if(!r.length||!r[0].offsetHeight)return;
  let max=1e9;
  if(r.length>4){const l=r[3];max=l.offsetTop+l.offsetHeight+4+4}
  const top=h.getBoundingClientRect().top+window.scrollY;
  const avail=window.innerHeight-reserve()-top;
  max=Math.max(Math.min(max,avail),90);
  if(max<h.scrollHeight+4)h.style.maxHeight=max+'px';
}
function fitLogo(){
  const g=document.querySelector('#form .logo');
  if(!g||$('form').classList.contains('hide'))return;
  g.style.display='';g.style.width='130px';
  const top=g.getBoundingClientRect().top+window.scrollY;
  const size=Math.min(130,window.innerHeight-reserve()-top-6);
  if(size<44)g.style.display='none';else g.style.width=size+'px';
}
function fitLayout(){fitHist();fitLogo()}
window.addEventListener('resize',fitLayout);
window.addEventListener('orientationchange',()=>setTimeout(fitLayout,200));
window.addEventListener('load',()=>setTimeout(fitLayout,100));
function init(){
  SECTIONS.forEach(s=>{$('section').add(new Option(s,s));$('e_section').add(new Option(s,s))});  $('date').value=today();render();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token&&$('form').classList.contains('hide'))fetchEntries().catch(()=>reconnectBanner())});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
}
init();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gisReady()"></script>
</body>
