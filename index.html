<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a1330">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Vault">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Family Vault</title>
<style>
:root{
  box-sizing:border-box;
  --cobalt:#0D2A5E;--cyan:#1FA6E0;--gold:#D4B26D;--gold2:#e6cf9c;
  --ink:#eef2ff;--muted:#b3c1ea;--field:#112553;--line:#D4B26D;
  --pos:#5fd08a;--neg:#ff8a80;
}
*{box-sizing:border-box}
html{min-height:100%;background:#0a1330;color-scheme:dark}
.logo{display:block;margin:0 auto;object-fit:contain;background:none;height:auto}
.logo.big{width:min(270px,74vw)}
.logo.mono{width:auto;max-width:100%;height:130px}
html,body{overscroll-behavior-y:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0a1330 0,#0a1330 calc(100% - 12px),rgba(10,19,48,0) 100%);padding:calc(env(safe-area-inset-top,0px) + 44px) 16px 12px;margin:0 -16px}
body{margin:0 auto;max-width:560px;min-height:100vh;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{margin:0 0 8px;padding:5px 7px;display:grid;grid-template-columns:34px 1fr 34px;align-items:center;text-align:center;border-radius:999px;border:2px solid var(--gold);background:linear-gradient(135deg,var(--cobalt),#2a509a);box-shadow:0 6px 16px rgba(0,0,0,.45)}
h1{margin:0;font-size:18px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#fff}
.pb{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;letter-spacing:.5px;color:var(--gold);background:rgba(13,42,94,.55);opacity:.32;transition:opacity .25s,box-shadow .25s,background .25s}
.pb.on{opacity:1;background:linear-gradient(135deg,#e2c586,#b9923f);color:#0D2A5E;box-shadow:0 0 10px rgba(212,178,109,.65)}
.tabs{display:flex;border-radius:999px;border:2px solid var(--gold);padding:3px;margin-bottom:8px;background:rgba(13,42,94,.6)}
.top .tabs:last-child{margin-bottom:0}
.tabs button{flex:1;border:2px solid transparent;background:none;padding:7px;border-radius:999px;font-size:16px;font-weight:800;color:var(--muted)}
.tabs button.on{background:linear-gradient(135deg,#4aa8e0,var(--cyan));border-color:var(--gold);color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tabs.sub{padding:2px}
.tabs.sub button{padding:4px;font-size:14px}
.tabs button.hide{display:none}
#cards{border:2px solid var(--gold);border-radius:24px;padding:8px;background:linear-gradient(180deg,#14306b,#0e2352)}
#cards .card:last-child{margin-bottom:0}
@media (max-height:700px){.top{padding-top:calc(env(safe-area-inset-top,0px) + 24px)}.tabs{margin-bottom:6px}#formI input,#formI select{height:36px}#formI label{margin:4px 6px 2px;font-size:13px}#formI .panel{padding:10px 12px}#formI .seg button{padding:7px 2px}#formI .save{padding:10px}#formI .ph{margin-bottom:2px}}
.tot{display:flex;justify-content:space-between;gap:8px;padding:0 6px 6px;font-size:12px;font-weight:700;color:var(--muted)}
.tot b{color:#fff}
.card{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:var(--cp,15px) 16px;border-radius:20px;margin-bottom:var(--cm,8px);font-weight:800;font-size:19px;border:2px solid var(--gold)}
.card .amt{font-variant-numeric:tabular-nums}
.card.p{padding:var(--cp,10px) 14px;border-radius:16px;font-size:15px}
.card.p .cn{display:block;min-width:0;flex:1}
.card.p .cn b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.p .cn small{display:block;font-size:11.5px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.p .rt{display:block;text-align:right;margin-left:10px;flex:none;font-variant-numeric:tabular-nums}
.card.p .rt b{display:block;font-size:16px}
.card.p .rt small{display:block;font-size:11.5px;font-weight:700;opacity:.85}
.card.gold{background:rgba(196,146,30,.42);color:#ffe08a}
.card.savings{background:rgba(40,150,70,.42);color:#a6f2b0}
.card.emergency{background:rgba(205,45,45,.42);color:#ffb3b3}
.card.travel{background:rgba(45,115,225,.42);color:#b3d6ff}
.card.violet{background:rgba(140,80,220,.42);color:#dcc2ff}
.card.gold,.e.gold{border-color:#e8b84a}
.card.savings,.e.savings{border-color:#4fd16b}
.card.emergency,.e.emergency{border-color:#ff6b6b}
.card.travel,.e.travel{border-color:#5aa9ff}
.card.violet,.e.violet{border-color:#b98cff}
.card,.e.gold,.e.savings,.e.emergency,.e.travel,.e.violet{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card.sel{box-shadow:0 0 0 4px var(--gold)}
h3{margin:10px 6px 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e{display:flex;justify-content:space-between;align-items:center;background:var(--field);border:2px solid var(--gold);border-radius:var(--rr,16px);padding:var(--rp,10px) 13px;margin-bottom:var(--rm,8px);font-size:var(--rf,14px)}
.e>div:first-child{min-width:0;flex:1}
.e>div:last-child{flex:none;margin-left:10px}
.e .t1,.e small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e small{color:var(--muted);margin-top:1px;font-size:var(--rs,12px)}
#hist{position:relative;border:2px solid var(--gold);border-radius:24px;padding:8px;background:linear-gradient(180deg,#14306b,#0e2352);max-height:292px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#hist.logomode{display:flex;align-items:center;justify-content:center;overflow:hidden}
#hist .e:last-child{margin-bottom:0}
.e.gold{background:rgba(196,146,30,.42);color:#ffe08a}
.e.savings{background:rgba(40,150,70,.42);color:#a6f2b0}
.e.emergency{background:rgba(205,45,45,.42);color:#ffb3b3}
.e.travel{background:rgba(45,115,225,.42);color:#b3d6ff}
.e.violet{background:rgba(140,80,220,.42);color:#dcc2ff}
.e.gold small,.e.savings small,.e.emergency small,.e.travel small,.e.violet small{color:inherit;opacity:.75}
.e.gold .inc,.e.savings .inc,.e.emergency .inc,.e.travel .inc,.e.violet .inc{color:#8dffa6}
.e.gold .exp,.e.savings .exp,.e.emergency .exp,.e.travel .exp,.e.violet .exp{color:#ff9d9d}
.inc{color:var(--pos);font-weight:800}.exp{color:var(--neg);font-weight:800}
.ivv{color:#fff;font-weight:800}.rei{color:#ffe08a;font-weight:800}
.panel{background:linear-gradient(180deg,#14306b,#0e2352);border:2px solid var(--gold);border-radius:26px;padding:14px}
.ph{display:flex;justify-content:space-between;align-items:baseline}.ph b{font-size:20px;color:#fff}.ph span{font-size:12px;color:var(--muted);font-weight:700}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:8px 6px 4px}
input,select{width:100%;height:42px;min-width:0;display:block;-webkit-appearance:none;appearance:none;padding:0 16px;font-size:16px;border:2px solid var(--gold);border-radius:999px;background:var(--field);color:var(--ink);font-family:inherit}
input::placeholder{color:#8da0d6}
input[type=date]{text-align:left;line-height:42px}
input:focus,select:focus{outline:3px solid var(--cyan)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.seg{display:flex;gap:10px}
.seg button{flex:1;padding:10px;font-size:16px;font-weight:800;border:2px solid var(--gold);background:var(--field);border-radius:999px;color:var(--muted)}
.seg.s3{gap:6px}.seg.s3 button{font-size:14px;padding:10px 2px}
.seg button.on,.seg button.on.x{background:linear-gradient(135deg,#4aa8e0,var(--cyan));color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.save{width:100%;margin-top:12px;padding:12px;font-size:18px;font-weight:900;color:var(--cobalt);border:0;border-radius:999px;background:linear-gradient(135deg,#e2c586,var(--gold))}
.save:disabled{opacity:.6}
.msg{text-align:center;margin-top:6px;font-size:14px;font-weight:700;min-height:18px}.err{color:var(--neg)}.ok{color:var(--pos)}
.empty{text-align:center;color:var(--muted);padding:14px;font-size:14px}
.hide{display:none}
.sync{margin:0 0 8px;padding:7px 12px;border-radius:999px;border:2px solid var(--gold);background:rgba(212,178,109,.18);color:var(--gold);font-size:13px;font-weight:800;text-align:center;cursor:pointer}
.sync.hide{display:none}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.sheet.hide{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(3,8,24,.65)}
.sheet-box{position:relative;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:28px;padding-bottom:18px;background:linear-gradient(180deg,#14306b,#0e2352)}
.btn2{width:100%;margin-top:10px;padding:13px;font-size:16px;font-weight:800;border-radius:999px;border:2px solid var(--gold);background:var(--field);color:var(--ink)}
.btn2.danger{color:var(--neg);border-color:var(--neg)}
#auth{display:none;text-align:center}
#auth p{color:var(--muted);margin:10px 0 0;font-size:14px}
.locked #auth{display:block}
.locked .tabs,.locked #funds,.locked #form,.locked #formI{display:none}
#mode.tap{cursor:pointer;color:var(--gold);text-decoration:underline}

/* ---------- glass + glow theme ---------- */
.sumbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;padding:7px 12px;border:2px solid rgba(212,178,109,.75);border-radius:999px;background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:12.5px;white-space:nowrap}.sumbar.hide{display:none}.sumbar span{display:flex;gap:5px;align-items:baseline}.sumbar b{color:#fff;font-weight:800}.sumbar i{font-style:normal;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}.sumbar u{width:2px;height:16px;border-radius:2px;background:var(--gold);opacity:.9;text-decoration:none}
html{background:#070e26;background-image:radial-gradient(60% 40% at 15% 8%,rgba(31,166,224,.28),transparent 70%),radial-gradient(55% 40% at 90% 40%,rgba(212,178,109,.20),transparent 70%),radial-gradient(70% 45% at 30% 100%,rgba(120,80,220,.25),transparent 70%);background-attachment:fixed}
.top{background:none}
header,.tabs,#cards,#hist,.panel,.sr,.sheet .panel{-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
header{background:linear-gradient(135deg,rgba(13,42,94,.45),rgba(42,80,154,.35));border-color:rgba(212,178,109,.8);box-shadow:0 0 6px rgba(212,178,109,.3),inset 0 1px 0 rgba(255,255,255,.18)}
.tabs{background:rgba(255,255,255,.06);border-color:rgba(212,178,109,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
#cards,#hist,.panel{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border-color:rgba(212,178,109,.8);box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18)}
.sr{background:rgba(255,255,255,.07)}
.e{background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card.gold,.e.gold{background:rgba(196,146,30,.30)}.card.savings,.e.savings{background:rgba(40,150,70,.30)}.card.emergency,.e.emergency{background:rgba(205,45,45,.30)}.card.travel,.e.travel{background:rgba(45,115,225,.30)}.card.violet,.e.violet{background:rgba(140,80,220,.30)}
input,select,.seg button{background:rgba(255,255,255,.07)}
.tabs button.on,.seg button.on,.seg button.on.x{background:linear-gradient(135deg,rgba(74,168,224,.75),rgba(31,166,224,.6));border-color:var(--gold);box-shadow:0 0 5px rgba(31,166,224,.85),inset 0 1px 0 rgba(255,255,255,.3)}
.seg button.on.x{background:linear-gradient(135deg,rgba(255,110,110,.7),rgba(220,70,70,.55));box-shadow:0 0 5px rgba(255,100,100,.85)}
.pb.on{box-shadow:0 0 5px rgba(212,178,109,.85)}
.card.sel{box-shadow:0 0 0 4px var(--gold),0 0 6px 4px rgba(212,178,109,.5)}
.card.gold.sel{box-shadow:0 0 0 4px var(--gold),0 0 6px 4px rgba(232,184,74,.5)}
.save{box-shadow:0 0 6px rgba(212,178,109,.5)}
</style>
</head>
<body class="locked">
<div class="top">
<header><span class="pb" id="pSM">SM</span><h1>Family Vault</h1><span class="pb" id="pDM">DM</span></header>
<div class="tabs" id="mt">
  <button id="m1" class="on" onclick="setApp('sav')">Savings</button>
  <button id="m2" onclick="setApp('inv')">Investments</button>
</div>
<div class="sumbar hide" id="sb"><span><b>Invested</b> <i id="s_inv">A$0</i></span><u></u><span><b>Share</b> <i id="s_share">A$0</i></span><u></u><span><b>Profit</b> <i id="s_profit">A$0</i></span></div>
<div class="tabs sub" id="st">
  <button id="t1" class="on" onclick="tab(1)">Stack</button>
  <button id="t2" onclick="tab(2)">Add</button>
</div>
</div>
<div id="auth" class="panel">
  <img class="logo big" src="logo.png" alt="Family Vault" style="margin-bottom:14px">
  <b style="font-size:20px;color:#fff">Sign in</b>
  <p>Use your Google account to open the vault.</p>
  <button class="save" id="signin" onclick="doSignIn()">Sign in with Google</button>
  <div class="msg" id="amsg"></div>
</div>

<div id="funds">
  <div id="sync" class="sync hide" onclick="manualSync()">Showing saved entries · tap to refresh</div>
  <div id="cards"></div>
  <h3 id="ht">Recent entries</h3>
  <div id="hist"><img id="fl" class="logo mono" src="logo-sm.png" alt="Family Vault"><div id="hlist"></div></div>
</div>

<div id="form" class="hide">
  <div class="panel">
    <div class="ph"><b>New entry</b><span id="mode"></span></div>
    <div class="row">
      <div><label>Section</label><select id="section"><option value="">Choose section</option></select></div>
      <div><label>Amount (AUD)</label><input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
    </div>
    <label>Type</label>
    <div class="seg"><button id="bi" class="on" onclick="setType('Income')">Income</button><button id="bx" onclick="setType('Expense')">Expense</button></div>
    <label>Date</label><input id="date" type="date">
    <label>Description</label><input id="desc" placeholder="Optional" maxlength="120">
    <button class="save" id="save" onclick="save()">Save entry</button>
    <div class="msg" id="msg"></div>
  </div>
  <img class="logo mono" src="logo-sm.png" alt="Family Vault" style="margin-top:12px">
</div>

<div id="formI" class="hide">
  <div class="panel">
    <div class="ph"><b>New investment entry</b><span></span></div>
    <div class="row">
      <div><label>Project</label><select id="i_proj"></select></div>
      <div><label>Amount (AUD)</label><input id="i_amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
    </div>
    <label>Entry type</label>
    <div class="seg s3" id="ntype"></div>
    <div class="row">
      <div><label>Date</label><input id="i_date" type="date"></div>
      <div id="src_w" class="hide"><label>Profit from</label><select id="i_src"></select></div>
    </div>
    <label>Description</label><input id="i_desc" placeholder="Optional" maxlength="160">
    <label>Comments</label><input id="i_com" placeholder="Optional" maxlength="160">
    <button class="save" id="isave" onclick="saveI()">Save entry</button>
    <div class="msg" id="imsg"></div>
  </div>
  <img class="logo mono" src="logo-sm.png" alt="Family Vault" style="margin-top:12px">
</div>

<div id="sheet" class="sheet hide">
  <div class="sheet-bg" onclick="closeEdit()"></div>
  <div class="panel sheet-box">
    <div class="ph"><b>Edit entry</b><span></span></div>
    <div class="row">
      <div><label>Section</label><select id="e_section"></select></div>
      <div><label>Amount (AUD)</label><input id="e_amount" type="number" inputmode="decimal" step="0.01" min="0"></div>
    </div>
    <label>Type</label>
    <div class="seg"><button id="ei" class="on" onclick="setEType('Income')">Income</button><button id="ex" onclick="setEType('Expense')">Expense</button></div>
    <label>Date</label><input id="e_date" type="date">
    <label>Description</label><input id="e_desc" placeholder="Optional" maxlength="120">
    <button class="save" id="e_save" onclick="saveEdit()">Save changes</button>
    <button class="btn2 danger" onclick="delEdit()">Delete entry</button>
    <button class="btn2" onclick="closeEdit()">Cancel</button>
    <div class="msg" id="e_msg"></div>
  </div>
</div>

<div id="sheetI" class="sheet hide">
  <div class="sheet-bg" onclick="closeIEdit()"></div>
  <div class="panel sheet-box">
    <div class="ph"><b>Edit investment entry</b><span></span></div>
    <div class="row">
      <div><label>Project</label><select id="ie_proj"></select></div>
      <div><label>Amount (AUD)</label><input id="ie_amount" type="number" inputmode="decimal" step="0.01" min="0"></div>
    </div>
    <label>Entry type</label>
    <div class="seg s3" id="etype"></div>
    <div class="row">
      <div><label>Date</label><input id="ie_date" type="date"></div>
      <div id="ie_src_w" class="hide"><label>Profit from</label><select id="ie_src"></select></div>
    </div>
    <label>Description</label><input id="ie_desc" placeholder="Optional" maxlength="160">
    <label>Comments</label><input id="ie_com" placeholder="Optional" maxlength="160">
    <button class="save" id="ie_save" onclick="saveIEdit()">Save changes</button>
    <button class="btn2 danger" onclick="delIEdit()">Delete entry</button>
    <button class="btn2" onclick="closeIEdit()">Cancel</button>
    <div class="msg" id="ie_msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const SECTIONS=['Gold','Savings','Emergency','Travel'];
let entries=[],type='Income',filter=null,store=null,role='';
let app='sav',sub=1;
let ients=[],iproj=[],ifilter=null,istore=null,itype='Investment';
const PCOL=['gold','savings','emergency','travel','violet'];
const ITYPES=[['Investment','Investment'],['Profit Made','Profit'],['Reinvested Profit','Reinvested']];
const $=id=>document.getElementById(id);
const money=n=>'AUD '+n.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const fm=n=>Number(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>typeof v==='number'?v:(parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''))||0);
const fdate=s=>{const[y,m,d]=String(s).split('-').map(Number);if(!y)return String(s);return new Date(y,m-1,d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})};
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortName=s=>String(s).replace(/\s*\(.*\)\s*$/,'');
const bracket=s=>{const m=String(s).match(/\((.*)\)\s*$/);return m?m[1]:''};

/* ---------- navigation ---------- */
function tab(n){
  sub=n;
  $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);
  $('funds').classList.toggle('hide',n!==1);
  $('form').classList.toggle('hide',!(n===2&&app==='sav'));
  $('formI').classList.toggle('hide',!(n===2&&app==='inv'));
  fitLayout();
}
function setApp(a){
  app=a;
  $('m1').classList.toggle('on',a==='sav');$('m2').classList.toggle('on',a==='inv');
  $('t1').textContent=a==='sav'?'Stack':'Build';$('sb').classList.toggle('hide',a!=='inv');
  updateSync();render();tab(1);
}
function setType(t){type=t;$('bi').className=t==='Income'?'on':'';$('bx').className=t==='Expense'?'on x':''}

/* ---------- savings ---------- */
function balances(){const b={};SECTIONS.forEach(s=>b[s]=0);entries.forEach(e=>{if(e.section in b)b[e.section]+=e.type==='Income'?e.amount:-e.amount});return b}
function render(){app==='sav'?renderSav():renderInv()}
function renderSav(){
  const b=balances();
  $('cards').innerHTML=SECTIONS.map(s=>`<button class="card ${s.toLowerCase()} ${filter===s?'sel':''}" onclick="toggle('${s}')"><span>${s}</span><span class="amt">${money(b[s])}</span></button>`).join('');
  const list=entries.filter(e=>!filter||e.section===filter).sort((a,c)=>c.date.localeCompare(a.date)||(c.ts||0)-(a.ts||0));
  $('ht').style.display='';
  if(!filter){$('ht').textContent='Tap a fund to see its history';$('hlist').innerHTML='';fitLayout();return}

/* ---------- storage: Google Sheets API (OAuth via Google Identity Services) ---------- */
const C=window.APP_CONFIG,L=localStorage,enc=encodeURIComponent;
const API='https://sheets.googleapis.com/v4/spreadsheets/'+C.SHEET_ID;
const IAPI=(C.INV_SHEET_ID&&!/^PASTE/i.test(C.INV_SHEET_ID))?'https://sheets.googleapis.com/v4/spreadsheets/'+C.INV_SHEET_ID:'';
const ITAB=C.INV_TAB_ENTRIES||'Entries',STAB=C.INV_TAB_SECTIONS||'Sections';
const VSI=C.VIEWERS_SEE_INVESTMENTS!==false;
const SCOPE='https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email';
let token=null,email=L.getItem('st_email')||'',tc=null;
try{const t=JSON.parse(L.getItem('st_token')||'null');if(t&&t.exp>Date.now()+60000)token=t.v}catch(e){}
try{entries=JSON.parse(L.getItem('st_cache')||'[]')}catch(e){}
try{const c=JSON.parse(L.getItem('iv_cache')||'null');if(c){ients=c.e||[];iproj=c.p||[]}}catch(e){}
role=L.getItem('st_role')||'';

function gisReady(){tc=google.accounts.oauth2.initTokenClient({client_id:C.CLIENT_ID,scope:SCOPE,callback:()=>{}});boot()}
function signIn(){return new Promise((res,rej)=>{
  if(!tc)return rej(new Error('Google sign-in not loaded'));
  tc.callback=r=>{if(r.error)return rej(new Error(r.error));token=r.access_token;
    L.setItem('st_token',JSON.stringify({v:token,exp:Date.now()+(r.expires_in-60)*1000}));res(token)};
  tc.error_callback=e=>rej(new Error(e.type==='popup_closed'?'Sign-in cancelled':'Sign-in blocked'));
  const o={prompt:email?'':'select_account'};if(email)o.login_hint=email;tc.requestAccessToken(o);
})}
const tok=()=>token?Promise.resolve(token):signIn();

async function call(base,path,opt={}){
  if(!base)throw new Error('Investments sheet not set up (add INV_SHEET_ID to config.js)');
  const r=await fetch(base+path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});
  if(r.status===401){token=null;L.removeItem('st_token');throw new Error('Session expired. Tap to reconnect.')}
  if(!r.ok){let m='Request failed';try{m=(await r.json()).error.message}catch(e){}throw new Error(m)}
  return r.json();
}
const api=(p,o)=>call(API,p,o);
const iapi=(p,o)=>call(IAPI,p,o);

/* Savings sheet layout: tab "Entries", data table headers in row 15, entries from row 16.
   Columns: A Date | B Person | C Section | D Type | E Amount | F Description */
const FIRST=16;
function toISO(v){
  if(typeof v==='string'&&/^\d{5}$/.test(v.trim()))v=Number(v);
  if(typeof v==='number'){return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10)}
  const s=String(v||'').trim();let m;
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return s.slice(0,10);
}
async function readRows(){
  const d=await api('/values/'+enc('Entries!A'+FIRST+':F')+'?valueRenderOption=UNFORMATTED_VALUE');
  return d.values||[];
}
async function fetchEntries(){
  const rows=await readRows();
  entries=[];
  rows.forEach((r,i)=>{
    const section=String(r[2]||'').trim(),type=String(r[3]||'').trim(),amount=Number(r[4]);
    if(!section||!type||!(amount>=0))return;
    entries.push({id:String(FIRST+i),row:FIRST+i,date:toISO(r[0]),person:String(r[1]||''),section,type,amount,desc:String(r[5]||''),ts:FIRST+i});
  });
  L.setItem('st_cache',JSON.stringify(entries));setStale('sav',false);render();
}
store={
  add:async e=>{await tok();
    const n=FIRST+(await readRows()).length;
    await api('/values/'+enc('Entries!A'+n+':F'+n)+'?valueInputOption=USER_ENTERED',{method:'PUT',body:JSON.stringify({values:[[e.date,e.person,e.section,e.type,e.amount,e.desc]]})});
    await fetchEntries()},
  edit:async(id,e)=>{await tok();
    const old=entries.find(x=>x.id===id);if(!old)return;
    const rows=await readRows(),r=rows[old.row-FIRST]||[];
    if(String(r[2]||'').trim()!==old.section||Number(r[4])!==old.amount){await fetchEntries();throw new Error('Sheet changed, reloaded')}
    const n=old.row;
    await api('/values/'+enc('Entries!A'+n+':F'+n)+'?valueInputOption=USER_ENTERED',{method:'PUT',body:JSON.stringify({values:[[e.date,old.person,e.section,e.type,e.amount,e.desc]]})});
    await fetchEntries()},
  del:async id=>{await tok();
    const old=entries.find(x=>x.id===id);if(!old)return;
    const rows=await readRows(),r=rows[old.row-FIRST]||[];
    if(String(r[2]||'').trim()!==old.section||Number(r[4])!==old.amount){await fetchEntries();throw new Error('Sheet changed, reloaded')}
    const m=await api('?fields=sheets.properties');const sid=m.sheets.find(s=>s.properties.title==='Entries').properties.sheetId;
    await api(':batchUpdate',{method:'POST',body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId:sid,dimension:'ROWS',startIndex:old.row-1,endIndex:old.row}}}]})});
    await fetchEntries()}
};

/* Investments sheet layout: tab ITAB, headers in row 1, entries from row 2.
   Columns: A Entry ID | B Date | C Section | D Description | E Comments | F Amount | G Updated | H Entry Type | I Profit Source
   Tab STAB: A Section | B Share Value | C Created */
async function fetchInv(){
  const e=await iapi('/values/'+enc(ITAB+'!A2:I')+'?valueRenderOption=UNFORMATTED_VALUE');
  let s={values:[]};try{s=await iapi('/values/'+enc(STAB+'!A2:C')+'?valueRenderOption=UNFORMATTED_VALUE')}catch(x){if(/expired/i.test(x.message))throw x}
  ients=[];
  (e.values||[]).forEach((r,i)=>{
    const section=String(r[2]||'').trim(),amount=num(r[5]);
    if(!section||!(amount>=0)||r[5]===''||r[5]==null)return;
    ients.push({id:String(r[0]||'r'+(i+2)),date:toISO(r[1]),section,desc:String(r[3]||'').trim(),comments:String(r[4]||'').trim(),amount,type:String(r[7]||'Investment').trim(),src:String(r[8]||'').trim(),ts:i});
  });
  iproj=[];
  (s.values||[]).forEach(r=>{const n=String(r[0]||'').trim();if(n&&!iproj.some(p=>p.name===n))iproj.push({name:n,share:num(r[1])})});
  ients.forEach(x=>{if(!iproj.some(p=>p.name===x.section))iproj.push({name:x.section,share:0})});
  L.setItem('iv_cache',JSON.stringify({e:ients,p:iproj}));
  fillProj();setStale('inv',false);render();
}
async function findRow(id){
  if(/^r\d+$/.test(id))return Number(id.slice(1));
  const col=(await iapi('/values/'+enc(ITAB+'!A:A'))).values||[];
  const i=col.findIndex(r=>r[0]===id);
  if(i<1){await fetchInv();throw new Error('Entry not found, reloaded')}
  return i+1;
}
const nowStamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())};
istore={
  add:async e=>{await tok();
    const row=[crypto.randomUUID(),e.date,e.section,e.desc,e.comments,e.amount,nowStamp(),e.type,e.type==='Reinvested Profit'?e.src:''];
    await iapi('/values/'+enc(ITAB+'!A:I')+':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:[row]})});
    await fetchInv()},
  edit:async(id,e)=>{await tok();
    const n=await findRow(id);
    await iapi('/values/'+enc(ITAB+'!B'+n+':I'+n)+'?valueInputOption=USER_ENTERED',{method:'PUT',body:JSON.stringify({values:[[e.date,e.section,e.desc,e.comments,e.amount,nowStamp(),e.type,e.type==='Reinvested Profit'?e.src:'']]})});
    await fetchInv()},
  del:async id=>{await tok();
    const n=await findRow(id);
    const m=await iapi('?fields=sheets.properties');const sid=m.sheets.find(s=>s.properties.title===ITAB).properties.sheetId;
    await iapi(':batchUpdate',{method:'POST',body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId:sid,dimension:'ROWS',startIndex:n-1,endIndex:n}}}]})});
    await fetchInv()}
};

async function start(){
  if(!email||!role){
    const u=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}})).json();
    email=(u.email||'').toLowerCase();
    role=email===C.OWNER.toLowerCase()?'owner':C.VIEWERS.map(x=>x.toLowerCase()).includes(email)?'viewer':'none';
    L.setItem('st_email',email);L.setItem('st_role',role);
  }
  if(role==='none'){const m='No access for '+email;signOut();$('amsg').textContent=m;$('amsg').className='msg err';return}
  document.body.classList.remove('locked');applyRole();
  try{await fetchEntries()}catch(e){setStale('sav',true,errText(e))}
  loadInv();
}

  $('amsg').textContent='';$('amsg').className='msg';
  try{await signIn();await start()}catch(e){$('amsg').textContent=e.message;$('amsg').className='msg err'}

function signOut(){
  try{if(token)google.accounts.oauth2.revoke(token)}catch(e){}
  ['st_token','st_email','st_role','st_cache','iv_cache'].forEach(k=>L.removeItem(k));
  token=null;email='';role='';entries=[];ients=[];iproj=[];setBadges();document.body.classList.add('locked');render();
}
function boot(){
  if(token)start();
  else if(email&&role){document.body.classList.remove('locked');applyRole();render();reconnectBanner()}
}

  F.style.setProperty('--cp',Math.max(5,base-i*1.2)+'px');
  F.style.setProperty('--cm',Math.max(3,8-i*.7)+'px');
  F.style.setProperty('--rp',l[0]+'px');F.style.setProperty('--rm',l[1]+'px');
  F.style.setProperty('--rf',l[2]+'px');F.style.setProperty('--rs',l[3]+'px');F.style.setProperty('--rr',l[4]+'px');
  return l[1];
}
function fitHist(){
  const F=$('funds');if(F.classList.contains('hide'))return;
  const h=$('hist'),f=$('fl'),cur=app==='sav'?filter:ifilter;
  h.style.height='';h.style.maxHeight='';
  const avail=()=>window.innerHeight-reserve()-(h.getBoundingClientRect().top+window.scrollY);
  if(!cur){
    h.classList.add('logomode');f.style.display='';f.style.height='40px';
    let i=0;setLevel(0);
    while(i<LV.length-1&&avail()<170){i++;setLevel(i)}
    const boxH=Math.max(avail(),100);
    h.style.height=boxH+'px';h.style.maxHeight='none';
    const asp=(f.naturalWidth&&f.naturalHeight)?f.naturalWidth/f.naturalHeight:0.93;
    const size=Math.min(boxH-4-24,(h.clientWidth-24)/asp);
    f.style.height=Math.max(size,40)+'px';
    return;
  }
  h.classList.remove('logomode');f.style.display='none';
  const r=h.querySelectorAll('.e');
  if(!r.length){setLevel(0);return}
  const k=Math.min(r.length,4);
  let curM=8;
  const need=n=>r[n-1].offsetTop+r[n-1].offsetHeight+Math.max(1,curM-2)+4;
  let i=0;
  for(;i<LV.length;i++){curM=setLevel(i);if(need(k)<=avail())break}
  if(i>=LV.length)curM=setLevel(LV.length-1);
  const av=avail();
  let kk=k;
  while(kk>2&&need(kk)>av)kk--;
  if(r.length>kk)h.style.maxHeight=need(kk)+'px';
  else if(need(kk)>av)h.style.maxHeight=Math.max(av,90)+'px';
}
function fitLogo(){
  const box=['form','formI'].map($).find(b=>b&&!b.classList.contains('hide'));
  const g=box&&box.querySelector('.logo');
  if(g){
    g.style.display='';g.style.height='130px';
    const top=g.getBoundingClientRect().top+window.scrollY;
    const size=Math.min(130,window.innerHeight-reserve()-top-6);
    if(size<44)g.style.display='none';else g.style.height=size+'px';
  }
}
function fitLayout(){fitHist();fitLogo()}
window.addEventListener('resize',fitLayout);
window.addEventListener('orientationchange',()=>setTimeout(fitLayout,200));
window.addEventListener('load',()=>setTimeout(fitLayout,100));
['fl'].forEach(i=>{const e=document.getElementById(i);if(e)e.addEventListener('load',fitLayout)});

  buildSeg('ntype',setIType);buildSeg('etype',setIEType);setIType('Investment');setIEType('Investment');
  fillProj();

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden||sub===2)return;
    if(token&&role){fetchEntries().catch(e=>setStale('sav',true,errText(e)));loadInv()}
    else if(email&&role){reconnectBanner();signIn().then(()=>start()).catch(()=>{})}
  });
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
}
init();
